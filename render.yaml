services:
  - type: web
    name: portfolio-seynabou
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true --server.enableCORS false --server.enableXsrfProtection false
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CONTACT_TO
        value: seynabousougou21@gmail.com
      - key: SMTP_EMAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
